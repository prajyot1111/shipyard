# The Gitea pack (c-735): a code host and nothing else, on the pack kit. Pull requests on a
# Gitea, through its API at the address each repo is cloned from, and plain git. No
# tracker, no stored sign-in, no dependency: git keeps the sign-in and this pack asks git
# for it when a request needs it. docs/atlas/62-packs.md, "The Gitea pack", says what it
# does, what it needs and what it never does.
name = "gitea"
version = "1"
description = "Gitea through its API, with the sign-in git keeps: when you approve a card, Shipyard marks its pull request ready as you and watches it for comments, reviews and failing checks. You or a teammate merge in Gitea. When you ask, it also brings you the pull requests that wait on your review."

[adapter]
spaces = ["work"]

[provides]
rules = ["rules/house.md", "rules/comments.md"]
skills = []
pipeline = "pipeline.md"
config_example = "config.example.toml"

# A code host, and the pull requests that wait on your review (`review`, and the Reviews
# gear's `providers/reviews`). No tracker, no CI page, and no `pr --flow` (a flow move of
# yours that opens a second pull request).
[capabilities]
codehost = true
reviews = true
routes = ["reviews"]

# The pack reads the commands its houses run: `guard <id>` (gt_fence.py), asked by Keel's
# house guard on every Bash call. `tools` are the command words it reads.
[guard]
tools = ["git", "tea", "curl", "wget"]

[terms]
change = "pull request"
changes = "pull requests"
change_short = "PR"
changes_short = "PRs"
codehost_name = "Gitea"

[space]
house_review = true
# Reviews start off: a space on this pack is brought review requests only once the user
# says so; its own `review_scan = true` wins.
review_scan = false

# Each requirement is a check (`./ready <name>`, exit 0 when ready) with a reason (`why`)
# and a fix (`fix`), both plain sentences. Keel shows the fix where the check fails (Setup,
# the first-run step, `keel doctor`). A `command` is written only where ONE line really does
# the fix. `done_when` says how you know it worked. `./ready` with no name prints all five
# as JSON with the specific sentences: which account, which repo, which address
# (gt_ready.py).
[[requires]]
name = "git"
kind = "command"
check = "./ready git"
for = ["codehost", "reviews"]
why = "git clones and pushes each repo, and it keeps the sign-in Shipyard uses to open pull requests as you, so it has to be installed."
fix = "Install git, then check again. On macOS: xcode-select --install. On Linux: sudo apt install git (Debian, Ubuntu) or sudo dnf install git (Fedora). Shipyard never installs it for you."
done_when = "`git --version` prints a version."

[[requires]]
name = "Gitea address"
kind = "command"
check = "./ready address"
for = ["codehost", "reviews"]
why = "Shipyard finds Gitea's API at the address each repo is cloned from, so each repo of the space needs an http or https address as its remote. An ssh address does not say where the API is."
fix = "Point the repo's remote at its http or https address in Gitea: in the repo's folder, run git remote set-url origin https://HOST/OWNER/REPO.git. If the repo does not live on a Gitea, keep its work on this machine and push when you say."
done_when = "`git remote get-url origin` in the repo's folder prints an http or https address."

[[requires]]
name = "Gitea sign-in"
kind = "secret"
check = "./ready sign-in"
for = ["codehost", "reviews"]
why = "Shipyard opens pull requests and posts your reviews as you, so git has to keep a sign-in for the Gitea address that Gitea accepts. git keeps it; Shipyard asks git for it when it needs it and never stores or prints it."
fix = "In a terminal, in the repo's folder, run git fetch. If git asks, give your Gitea user name and password, or an access token made in Gitea under Settings, Applications, in place of the password. Then check again."
command = "git fetch"
done_when = "`git fetch` in the repo's folder finishes without asking for a password, and this check passes."

[[requires]]
name = "Gitea token"
kind = "secret"
check = "./ready token"
for = ["codehost", "reviews"]
why = "When the sign-in git keeps is an access token, it may do only what it was made for. A token made only for pushing can open a pull request, but Gitea will not let it read or answer your teammates' comments or say whose it is, so Shipyard could not bring you review comments or tell its own replies apart."
fix = "In Gitea, open Settings, then Applications, and make an access token allowed write:repository, write:issue and read:user. Then give it to git in place of the one it keeps. Run ./ready token in the pack's folder for the exact lines to copy, with your Gitea's address in them."
done_when = "`./ready token` in the pack's folder says the sign-in may read who you are and the comments on pull requests."

[[requires]]
name = "Gitea access"
kind = "secret"
check = "./ready access"
for = ["codehost"]
why = "Shipyard pushes a card's branch and opens its pull request as you, so the signed-in account needs write access to each repository. Seeing it is not enough."
fix = "Ask the repository's owner to give your account write access in Gitea, or sign in as an account that has it. Run ./ready in the pack's folder to see which account and which repository."

# Its own first-run step: done once the five checks pass in each space on the pack.
[[setup]]
id = "connect"
title = "Connect Gitea"
text = "setup/connect.md"
for = ["codehost"]
requires = ["git", "Gitea address", "Gitea sign-in", "Gitea token", "Gitea access"]
